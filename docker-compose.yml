services:
  eo-suivi:
    build: .
    restart: unless-stopped
    ports:
      # L'application accepte HTTP pour un usage local. Ne pas exposer le
      # cookie de session en clair sur le réseau : publier via un reverse
      # proxy HTTPS pour un accès distant.
      - "127.0.0.1:8080:8080"
    volumes:
      - eo_data:/data
    environment:
      RUST_LOG: info

volumes:
  eo_data:
