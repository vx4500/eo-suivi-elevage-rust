{% extends "base.html" %}{% block content %}<h1>Utilisateurs</h1><form class="card rust-actions" method="post" action="/utilisateurs/creer"><input type="hidden" name="csrf_token" value="{{ session.csrf }}"><label>Identifiant<input name="identifiant" required></label><label>Nom<input name="nom"></label><label>Prénom<input name="prenom"></label><label>Rôle<select name="role"><option value="salarie">Salarié</option><option value="eleveur">Éleveur</option><option value="engraisseur">Engraisseur</option><option value="admin">Admin</option></select></label><label>Mot de passe<input type="password" name="mdp" minlength="8" required></label><button>Créer</button></form><table><tr><th>Identifiant</th><th>Nom</th><th>Rôle</th><th>Actif</th></tr>{% for u in utilisateurs %}<tr><td>{{ u.identifiant }}</td><td>{{ u.prenom or '' }} {{ u.nom or '' }}</td><td>{{ u.role }}</td><td>{{ 'oui' if u.actif else 'non' }}</td></tr>{% endfor %}</table>{% endblock %}
