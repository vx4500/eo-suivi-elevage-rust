{% extends "base.html" %}{% block title %}Scanner · EO-Suivi{% endblock %}{% block content %}
<h1>Scanner un animal</h1><section class="card"><label>RFID, numéro national ou numéro de travail<input id="scan-code" autofocus autocomplete="off"></label><button id="scan-go">Rechercher</button><div id="scan-results"></div></section>
<script>const input=document.getElementById('scan-code'),results=document.getElementById('scan-results');async function lookup(){const q=input.value.trim();if(!q)return;results.textContent='Recherche…';const r=await fetch('/scan/lookup?q='+encodeURIComponent(q));const data=await r.json();results.innerHTML='';for(const x of data.resultats||[]){const a=document.createElement('a');a.className='card';a.style.display='block';a.style.marginTop='10px';a.href=x.type==='truie'?'/truie/'+x.id:'/charcutier/'+x.id;a.textContent=(x.type==='truie'?'Truie ':'Porc ')+(x.numero||'')+(x.bande_code?' · bande '+x.bande_code:'');results.appendChild(a)}if(!results.children.length)results.textContent='Aucun résultat';}document.getElementById('scan-go').onclick=lookup;input.addEventListener('keydown',e=>{if(e.key==='Enter')lookup()});</script>
{% endblock %}
