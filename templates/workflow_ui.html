<style>
.workflow [hidden]{display:none!important}
.workflow{max-width:1500px;margin:auto}.workflow .hero{padding:24px;background:linear-gradient(120deg,#153f34,#2d6857);color:white;border-radius:18px;margin-bottom:20px}.workflow .hero h1{color:white;margin:0 0 8px}.workflow .hero p{margin:0;max-width:850px;color:#e4f2e9}.workflow .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;align-items:end}.workflow .form-grid label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px;color:#254333}.workflow input,.workflow select,.workflow textarea{max-width:100%;box-sizing:border-box}.workflow fieldset{border:1px solid #d5e4dc;border-radius:12px;padding:14px}.workflow .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.workflow .choice{font-size:16px;color:#183e2e;flex-direction:row;line-height:1.4;display:flex;align-items:center;gap:10px;padding:14px;background:#f4f8f5;border:1px solid #dce8e0;border-radius:12px;cursor:pointer}.workflow .choice:has(input:checked){background:#dff1e7;border-color:#347b5b}.workflow input[type=checkbox]{width:20px;height:20px;flex-shrink:0}.workflow .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:18px 0}.workflow .toolbar a{padding:10px 16px;border-radius:10px;background:#edf4ef;color:#174735;text-decoration:none}.workflow .card{border:1px solid #dae5de;box-shadow:0 4px 18px #12352808;border-radius:16px;padding:22px}.workflow summary{cursor:pointer;min-height:32px;font-size:17px}.workflow table{width:100%;border-collapse:separate;border-spacing:0}.workflow th{background:#eaf2ed;position:sticky;top:0;z-index:1;white-space:nowrap}.workflow td{padding:13px 12px;border-bottom:1px solid #e6ede8}.workflow tr.chosen td{background:#dcf2e3!important;font-weight:600}.workflow .priority-1 td{background:#f0f6f3}.workflow .priority-2 td{background:#fff5c7}.workflow .priority-3 td{background:#ffe3c7}.workflow .priority-4 td{background:#fbd5d5}.workflow .legend{display:flex;gap:10px;flex-wrap:wrap}.workflow .legend span{padding:8px 12px;border-radius:10px}.workflow .help{color:#526a5d;line-height:1.6}.workflow .section-head{display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap}.workflow .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.workflow .protocol-card{border-top:4px solid #377b61}.workflow .protocol-card h3{margin-top:0}.workflow .empty{padding:32px;text-align:center;color:#637267}.workflow button:focus-visible,.workflow a:focus-visible,.workflow summary:focus-visible{outline:3px solid #2d78b4;outline-offset:3px}@media(max-width:650px){.workflow .hero{padding:18px}.workflow .card{padding:15px}.workflow .form-grid{grid-template-columns:1fr}.workflow .toolbar>*{max-width:100%}}
