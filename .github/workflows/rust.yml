name: Rust

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Vérifier les scripts de déploiement
        run: bash -n scripts/mettre-a-jour-debian13.sh && sh -n scripts/build-linux-musl.sh scripts/lancer.sh
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      - name: Tests complets
        run: cargo test

  linux-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Outils musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Binaire Linux statique
        run: ./scripts/build-linux-musl.sh
      - name: Vérifier la liaison statique
        run: file target/x86_64-unknown-linux-musl/release/eo-suivi-elevage | grep -Eq "statically linked|static-pie linked"
      - uses: actions/upload-artifact@v4
        with:
          name: eo-suivi-elevage-2.2.43-linux-x86_64-musl
          path: target/x86_64-unknown-linux-musl/release/eo-suivi-elevage
          if-no-files-found: error
