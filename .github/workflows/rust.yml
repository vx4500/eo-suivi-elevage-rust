name: Rust

on:
  push:
  pull_request:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt
      - run: cargo clippy --all-targets -- -D warnings
      - name: Tests complets
        if: runner.os != 'Windows'
        run: cargo test
      - name: Tests Windows (hors PBKDF2 lent, déjà testé sous Linux)
        if: runner.os == 'Windows'
        run: cargo test -- --skip lit_un_hash_python_v165 --skip nouveau_hash_est_verifiable
