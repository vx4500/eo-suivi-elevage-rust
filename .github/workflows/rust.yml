name: Rust

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Vérifier les scripts de déploiement
        if: runner.os == 'Linux'
        run: bash -n scripts/mettre-a-jour-debian13.sh && sh -n scripts/build-linux-musl.sh scripts/lancer.sh
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt
      - name: Tests complets
        if: runner.os != 'Windows'
        run: cargo test
      - name: Tests Windows (hors PBKDF2 lent, déjà testé sous Linux)
        if: runner.os == 'Windows'
        run: cargo test -- --skip lit_un_hash_python_v165 --skip nouveau_hash_est_verifiable

  linux-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Outils musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Binaire Linux statique
        run: ./scripts/build-linux-musl.sh
      - name: Vérifier la liaison statique
        run: file target/x86_64-unknown-linux-musl/release/eo-suivi-elevage | grep -Eq "statically linked|static-pie linked"
      - uses: actions/upload-artifact@v4
        with:
          name: eo-suivi-elevage-2.2.0-linux-x86_64-musl
          path: target/x86_64-unknown-linux-musl/release/eo-suivi-elevage
          if-no-files-found: error
